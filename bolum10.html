	var nr = 0;
	function anzeigen() {
    document.getElementById("frageText").innerHTML = fragen[nr].frage;
    document.getElementById("textA").innerHTML = fragen[nr].A;
    document.getElementById("textB").innerHTML = fragen[nr].B;
    document.getElementById("textC").innerHTML = fragen[nr].C;
    document.getElementById("textD").innerHTML = fragen[nr].D;
    document.getElementById("meldung").innerHTML = "";

    var radios = document.querySelectorAll('input[name="ant"]');
    for (var i = 0; i < radios.length; i++) {
        radios[i].checked = false;
    }
    document.querySelector('form').style.display = "block";
	}

	function weiter() {
		var auswahl = document.querySelector('input[name="ant"]:checked');
		if(auswahl == null){
			document.getElementById("meldung").innerHTML = "Lütfen bir cevap seçiniz!";
			return;
		}
		if(auswahl.value == fragen[nr].richtig){
			nr = nr + 1;

			if(nr < fragen.length){
				anzeigen();
			} else {
				document.getElementById("frageText").innerHTML = "Bölüm tamamlandı";
				document.getElementById("meldung").innerHTML = "Tüm soruları doğru cevapladın! <br> Aferin...";
				document.querySelector('form').style.display = "none";
				}
		} else {
			document.getElementById("meldung").innerHTML = "Cevabın yanlış, tekrar dene";
		}
	}
	
	function springeZuFrage() {
    var nummer = parseInt(document.getElementById("frageNummer").value);
    if(isNaN(nummer) || nummer < 1){
        document.getElementById("meldungSprung").innerHTML = "Lütfen geçerli bir sayı girin!";
        return;
    }
    if(nummer > fragen.length){
        document.getElementById("meldungSprung").innerHTML = 
            "O kadar soru yok! <br> Din Sosyolojisi bölümünde en fazla " + fragen.length + " soru bulunmaktadır.";
        return;
    }
    nr = nummer - 1;
    anzeigen();
    document.getElementById("meldungSprung").innerHTML = "";
	}
	
	anzeigen();
	</script>
